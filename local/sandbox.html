<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sandbox proxy</title>
    <style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}</style>
  </head>
  <body>
    <script>
      // The proxy of the SDK's basic-host example, shortened: relays messages
      // between the host and the inner iframe, and writes the View into it.
      const HOST = new URL(document.referrer).origin;
      const innerMode = new URL(location.href).searchParams.get("inner");
      const inner = document.createElement("iframe");
      inner.setAttribute("sandbox", innerMode === "opaque" ? "allow-scripts" : "allow-scripts allow-same-origin allow-forms");
      document.body.append(inner);
      addEventListener("message", (event) => {
        if (event.source === parent) {
          if (event.origin !== HOST) return;
          if (event.data?.method === "ui/notifications/sandbox-resource-ready") {
            const { html, sandbox } = event.data.params;
            if (typeof sandbox === "string") inner.setAttribute("sandbox", sandbox);
            const doc = inner.contentDocument;
            if (doc) { doc.open(); doc.write(html); doc.close(); }
            else inner.srcdoc = html;
          } else {
            inner.contentWindow.postMessage(event.data, "*");
          }
        } else if (event.source === inner.contentWindow) {
          parent.postMessage(event.data, HOST);
        }
      });
      parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} }, HOST);
    </script>
  </body>
</html>
