<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fyug WASM engine probe</title>
    <style>
      :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; --mid: #9a6700; --line: #8884; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; font: 15px/1.4 system-ui, sans-serif; background: transparent; }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p { margin: 4px 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
      button { min-height: 44px; padding: 0 14px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: #8881; color: inherit; }
      button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
      button:disabled { opacity: 0.5; }
      label { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
      #summary { font-weight: 600; }
      ul { list-style: none; margin: 8px 0; padding: 0; }
      li { border-top: 1px solid var(--line); padding: 6px 0; word-break: break-word; }
      .tag { display: inline-block; min-width: 3.4em; font: 600 12px ui-monospace, monospace; padding: 1px 6px; border-radius: 4px; color: #fff; text-align: center; margin-right: 6px; }
      .pass { background: var(--ok); } .fail { background: var(--bad); } .info { background: #6b7280; } .skip { background: var(--mid); }
      .detail { display: block; font: 12px/1.35 ui-monospace, monospace; opacity: 0.85; white-space: pre-wrap; margin-top: 2px; }
      textarea { width: 100%; height: 14em; font: 11px/1.3 ui-monospace, monospace; }
      h2 { font-size: 14px; margin: 14px 0 2px; }
    </style>
  </head>
  <body>
    <h1>Fyug WASM engine probe</h1>
    <p id="mode"></p>
    <p id="summary">Starting...</p>

    <h2>1. Engine source</h2>
    <div class="row" id="sources"></div>
    <div class="row">
      <button id="run-checks">Run checks again</button>
    </div>

    <h2>2. Audio test (needs a tap)</h2>
    <p>Plays a quiet 220 Hz tone through the engine. Start with the first button.</p>
    <div class="row">
      <button id="play-url" class="primary">Play: engine worklet by URL</button>
      <button id="play-main">Play: main thread (ScriptProcessor)</button>
      <button id="play-embedded">Play: default (embedded blob)</button>
    </div>
    <div class="row">
      <button id="pitch" disabled>Change pitch to 330 Hz</button>
      <button id="stop" disabled>Stop</button>
      <label><input type="checkbox" id="quiet" /> Measure only (no sound out)</label>
    </div>
    <div class="row">
      <span>Did you hear the tone?</span>
      <button id="heard-yes">Yes</button>
      <button id="heard-no">No</button>
    </div>

    <h2>3. Results</h2>
    <ul id="results"></ul>

    <h2>4. Report</h2>
    <div class="row">
      <button id="copy">Copy report</button>
      <button id="send">Send report to chat</button>
      <span id="copy-status"></span>
    </div>
    <textarea id="report" readonly></textarea>

    <script type="application/json" id="probe-config">/*CONFIG*/</script>
    <script>/*BUNDLE*/</script>
  </body>
</html>
