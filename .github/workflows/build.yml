name: Build Script

# Checks build.sh and the pin on every pull request, pin pull requests
# included, before Vercel's own build of the same commit matters.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Build Script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint
        run: shellcheck build.sh

      - name: Test
        run: python3 -I test/build_test.py
